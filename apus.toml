[engine]
author = "mjojo"
model_path = "glm-5.2-744b-q4.apus"
session_roost_path = "coding_rust.roost"
storage_backend = "block"
quant_format = "int4_imatrix"

[model]
name = "GLM-5.2-744B-Q4_K_M"
total_layers = 75
total_experts = 21504
experts_per_layer = 288
active_experts_per_tok = 8
shared_experts_per_layer = 2
hidden_size = 4096
mla_latent_dim = 576
mtp_heads = 2

[memory]
vram_total_gb = 16.0
vram_dense_reserved_gb = 10.0
vram_l1_cache_gb = 4.199999809265137
ram_slab_gb = 24.0
expert_slot_size_bytes = 19922944
lock_pages_in_ram = true

[qos]
os_drive_mode = true
io_priority = "idle"
max_bandwidth_gbs = 5.5
max_nvme_potential_gbs = 7.0
max_queue_depth = 32
sata_ahci_compat = false

[thermal]
enabled = true
target_temp_c = 60
yellow_zone_temp_c = 65
red_zone_temp_c = 70
poll_interval_ms = 500

[topology]
num_gpus = 2
pipeline_split_layer = 37
enable_p2p_dma = true
pinned_host_fallback = true
numa_node = 0

[server]
host = "127.0.0.1"
port = 8080
max_batch_size = 8
continuous_batching = true
